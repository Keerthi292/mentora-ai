# Alembic (database migrations). Run from backend/, e.g. `uv run alembic upgrade head`.

[alembic]
script_location = %(here)s/alembic
# So alembic/env.py can import the `app` package
prepend_sys_path = .
path_separator = os
# Left empty: alembic/env.py uses DATABASE_URL from backend/.env
sqlalchemy.url =

# Logging: Alembic's progress messages, SQLAlchemy and everything else only on warnings

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
